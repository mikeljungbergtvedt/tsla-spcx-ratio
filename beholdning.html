<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14"><title>Beholdning</title>
<style>
body{margin:0;background:#0b0f14;color:#e6e6e6;font:15px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 30px;max-width:640px}
h1{font-size:14px;color:#8a96a3;font-weight:500;margin:16px 0 2px}
#tot{font-size:52px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.up{color:#3ddc84}.dn{color:#ff5c5c}.sub{color:#8a96a3;font-size:13px}
.card{background:#121922;border-radius:10px;padding:12px;margin:10px 0}
.card b{font-size:26px;display:block;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums;font-size:14px}
</style></head><body>
<h1>Kurser</h1><div id="px" class="sub"></div>
<h1>Totalt, netto (uten Ascenium)</h1><div id="tot">–</div><div id="totd" class="sub"></div>
<div class="card" id="as"></div>
<div class="card" id="ze"></div>
<div class="sub" id="upd"></div>
<div class="sub" style="margin-top:10px">Beholdning per 26.10 fra skjermbildene dine. Zero: kontantbeholdning ikke lagt inn ennå. Send skjermbilde når noe endres.</div>
<script>
const H={as:{TSLA:5,SPCX:5000,ZAP:200000,usd:818952.98,nok:-12526285.37},ze:{TSLA:0,SPCX:6500,ZAP:70000,AUTO:50000}};
const f=(x,n=0)=>x.toLocaleString('nb-NO',{minimumFractionDigits:n,maximumFractionDigits:n});
const kr=x=>f(x)+' kr',sg=x=>`<span class="${x>=0?'up':'dn'}">${x>=0?'+':''}${f(x)} kr</span>`;
async function load(){
 const [A,B]=await Promise.all(['data.json','zap-tsla.json'].map(u=>fetch(u+'?'+Date.now(),{cache:'no-store'}).then(r=>r.json())));
 const fx=B.fx,t=B.t,z=B.z,s=A.live&&A.live.s?A.live.s:A.rows.at(-1).s;
 const td=new Date().toISOString().slice(0,10);
 const ar=A.rows,pa=ar.at(-1).d>=td?ar.at(-2):ar.at(-1);
 const br=B.rows,pz=br.at(-1).d>=td?br.at(-2):br.at(-1);
 const P={TSLA:[t*fx,pa.t*fx],SPCX:[s*fx,pa.s*fx],ZAP:[z,pz.z],AUTO:[B.a||0,B.ap||B.a||0]};
 px.innerHTML=`TSLA ${f(t,2)} · SPCX ${f(s,2)} · ZAP ${f(z,2)} · AUTO ${f(B.a||0,2)} · USDNOK ${f(fx,4)}`;
 let T=0,TD=0;
 for(const k of ['as','ze']){const h=H[k];let v=0,d=0,rows='';
  for(const n of ['TSLA','SPCX','ZAP','AUTO']){if(!h[n])continue;const val=h[n]*P[n][0],dd=h[n]*(P[n][0]-P[n][1]);v+=val;d+=dd;
   rows+=`<div class="row"><span>${f(h[n])} ${n}</span><span>${kr(val)} · ${sg(dd)}</span></div>`}
  const cash=(h.usd||0)*fx+(h.nok||0);
  if(cash)rows+=`<div class="row"><span>Saldo (kreditt)</span><span>${kr(cash)}</span></div>`;
  const net=v+cash;T+=net;TD+=d;
  document.getElementById(k).innerHTML=`<span class="sub">${k=='as'?'Mike AS · 700937':'Nordnet Zero · 62179932'}</span><b>${kr(net)}</b><div class="sub">i dag ${sg(d)}</div>${rows}`}
 tot.textContent=kr(T);totd.innerHTML='i dag '+sg(TD);
 upd.textContent='Oppdatert '+new Date(A.updated>B.updated?A.updated:B.updated).toLocaleString('nb-NO',{timeZone:'Europe/Oslo'})+' (norsk tid)';
}
load();setInterval(load,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
