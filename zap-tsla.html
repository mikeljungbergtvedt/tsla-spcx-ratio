<!doctype html><html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSLA/ZAP"><meta name="theme-color" content="#0b0f14">
<link rel="icon" type="image/png" href="icon-180.png"><link rel="apple-touch-icon" href="icon-180.png"><title>TSLA/ZAP</title>
<style>
body{margin:0;background:#0b0f14;color:#e6e6e6;font:15px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 30px}
h1{font-size:14px;color:#8a96a3;font-weight:500;margin:14px 0 2px}
#prices{font-size:42px;font-weight:700;line-height:1.1;margin:8px 0 4px;color:#fff;font-variant-numeric:tabular-nums}
#prices .sep{color:#8a96a3;font-weight:500;margin:0 6px}
#big{font-size:64px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.up{color:#3ddc84}.dn{color:#ff5c5c}.sub{color:#8a96a3;font-size:14px}
.legs{display:flex;gap:12px;margin:8px 0}.legs div{flex:1;background:#121922;border-radius:10px;padding:10px}.legs b{font-size:22px;display:block}
svg{width:100%;height:240px;display:block;margin:12px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid #1c242d}th{color:#8a96a3;font-weight:500}
td:first-child,th:first-child{text-align:left}
@media (max-width:400px){#prices{font-size:32px}#big{font-size:52px}}
</style></head><body>
<h1>TSLA (USD) / ZAP (NOK)</h1>
<div id="prices">–</div>
<div class="sub" id="fx"></div>
<h1 style="margin-top:18px">Resultat traden</h1>
<div id="big">–</div>
<div class="legs"><div><span class="sub">ZAP-del · 80 000 à 56,80</span><b id="zl"></b></div><div><span class="sub">TSLA-del · 1 500 solgt à 379,50</span><b id="tl"></b></div></div>
<div class="sub" id="goal"></div>
<div class="sub" id="upd"></div>
<svg id="c"></svg>
<table><thead><tr><th>Dato</th><th>TSLA</th><th>ZAP</th><th>Resultat</th></tr></thead><tbody id="tb"></tbody></table>
<script>
const f=(x,n=2)=>x.toLocaleString('nb-NO',{minimumFractionDigits:n,maximumFractionDigits:n});
const kr=x=>(x>=0?'+':'')+f(x,0)+' kr',cl=x=>x>=0?'up':'dn';
function load(){fetch('zap-tsla.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(D=>{
 const P=D.pnl,R=(D.rows||[]).filter(x=>x.d>='2026-10-23');
 prices.innerHTML=`${f(D.t)}<span class="sep">/</span>${f(D.z)}`;
 fx.textContent='USDNOK '+f(D.fx,4);
 big.textContent=kr(P.total);big.className=cl(P.total);
 zl.textContent=kr(P.zap);zl.className=cl(P.zap);tl.textContent=kr(P.tsla);tl.className=cl(P.tsla);
 const gz=80000*(65-56.8),gt=1500*(379.5-380)*D.fx;
 goal.textContent=`Mål: ZAP 65 (${f(65-D.z)} igjen) · TSLA tilbake ≤ 380 (nå ${f(D.t)}) · ved mål ≈ ${kr(gz+gt)}`;
 upd.textContent='Oppdatert '+new Date(D.updated).toLocaleString('nb-NO',{timeZone:'Europe/Oslo'})+' (norsk tid)';
 const pts=R.map(x=>x.p).concat([P.total]);
 if(pts.length>1){const W=360,H=240,p=44,mn=Math.min(0,...pts)-20000,mx=Math.max(0,...pts)+20000;
  const X=i=>p+i*(W-p-6)/(pts.length-1),Y=v=>6+(mx-v)*(H-30)/(mx-mn);
  let s='';for(let k=0;k<5;k++){const v=mn+(mx-mn)*k/4;s+=`<line x1="${p}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1c242d"/><text x="0" y="${Y(v)+4}" fill="#8a96a3" font-size="10">${f(v/1000,0)}k</text>`}
  s+=`<line x1="${p}" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#ffd24d" stroke-dasharray="4 3"/>`;
  s+=`<polyline fill="none" stroke="#4da3ff" stroke-width="2" points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
  c.setAttribute('viewBox',`0 0 ${W} ${H}`);c.innerHTML=s;}
 tb.innerHTML=R.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${f(x.t)}</td><td>${f(x.z)}</td><td class="${cl(x.p)}">${kr(x.p)}</td></tr>`).join('');
});}
load();setInterval(load,5*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
