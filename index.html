<!doctype html><html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSLA/SPCX"><meta name="theme-color" content="#0b0f14">
<link rel="icon" type="image/png" href="icon-180.png"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json">
<title>TSLA/SPCX</title>
<style>
body{margin:0;background:#0b0f14;color:#e6e6e6;font:15px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 30px}
h1{font-size:14px;color:#8a96a3;font-weight:500;margin:14px 0 2px}
#prices{font-size:42px;font-weight:700;letter-spacing:-0.5px;line-height:1.1;margin:8px 0 4px;color:#fff;font-variant-numeric:tabular-nums}
#prices .sep{color:#8a96a3;font-weight:500;margin:0 6px}
#big,#kr{font-size:64px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}#big{font-size:40px}#chg{font-size:18px;margin-left:8px}
.legs{display:flex;gap:12px;margin:8px 0}.legs div{flex:1;background:#121922;border-radius:10px;padding:10px}.legs b{font-size:22px;display:block}
.up{color:#3ddc84}.dn{color:#ff5c5c}.sub{color:#8a96a3;font-size:14px}
svg{width:100%;height:240px;display:block;margin:12px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid #1c242d}th{color:#8a96a3;font-weight:500;position:sticky;top:0;background:#0b0f14}
td:first-child,th:first-child{text-align:left}.hi{color:#ffd24d;font-weight:600}
@media (max-width:400px){#prices{font-size:32px}#big{font-size:32px}#kr{font-size:52px}}
</style></head><body>
<h1>TSLA / SPCX</h1>
<div id="prices">–</div>
<div class="sub" id="when"></div>
<h1 style="margin-top:18px">Resultat byttet</h1>
<div id="kr">–</div>
<div class="legs"><div><span class="sub">Mike AS · 2 000 TSLA → 5 000 SPCX</span><b id="la"></b></div><div><span class="sub">Zero · 2 500 TSLA → 6 500 SPCX</span><b id="lz"></b></div></div>
<h1 style="margin-top:18px">Bytteforhold</h1>
<div><span id="big">–</span><span id="chg"></span></div>
<div class="sub" id="upd"></div>
<svg id="c"></svg>
<div class="sub" id="ipo"></div>
<table><thead><tr><th>Dato</th><th>TSLA</th><th>SPCX</th><th>Forhold</th></tr></thead><tbody id="tb"></tbody></table>
<script>
const L=2.5,f=(x,n=2)=>x.toLocaleString('nb-NO',{minimumFractionDigits:n,maximumFractionDigits:n});
function load(){fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(D=>{
 const R=D.rows,last=R[R.length-1],prev=R[R.length-2];
 let t=last.t,s=last.s,lt=last.d,pr=prev;
 if(D.live&&D.live.t&&D.live.s){const ld=new Date(D.live.time*1000).toLocaleDateString('sv-SE',{timeZone:'America/New_York'});
  if(ld>last.d){t=D.live.t;s=D.live.s;lt=ld+' ('+(D.live.tag||'intradag')+')';pr=last}}
 const r=t/s,c=r-pr.r;
 prices.innerHTML=`${f(t)}<span class="sep">/</span>${f(s)}`;
 when.textContent=lt;
 big.textContent=f(r,3);chg.textContent=(c>=0?'+':'')+f(c,3)+' i dag';chg.className=c>=0?'up':'dn';
 if(D.swap&&D.swap.fx){const X=D.swap.fx,A=(5000*(s-150.4408)+2000*(385.455-t))*X,Z=(6500*(s-148.98)+2500*(389.80-t))*X,K=v=>(v>=0?'+':'')+f(v,0)+' kr',C=v=>v>=0?'up':'dn';kr.textContent=K(A+Z);kr.className=C(A+Z);la.textContent=K(A);la.className=C(A);lz.textContent=K(Z);lz.className=C(Z)}
 upd.textContent='Oppdatert '+new Date(D.updated).toLocaleString('nb-NO',{timeZone:'Europe/Oslo'})+' (norsk tid)';
 ipo.textContent=`Første handelsdag SPCX: ${R[0].d} · forhold ${f(R[0].r,3)}`;
 const W=360,H=240,p=28,rs=R.map(x=>x.r),mn=Math.min(...rs)*.98,mx=Math.max(...rs)*1.02;
 const X=i=>p+i*(W-p-6)/(R.length-1),Y=v=>6+(mx-v)*(H-30)/(mx-mn);
 let g='';for(let k=0;k<5;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="${p}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1c242d"/><text x="0" y="${Y(v)+4}" fill="#8a96a3" font-size="10">${f(v)}</text>`}
 [0,Math.floor(R.length/2),R.length-1].forEach(i=>g+=`<text x="${Math.min(X(i),W-60)}" y="${H-4}" fill="#8a96a3" font-size="10">${R[i].d.slice(5)}</text>`);
 g+=`<polyline fill="none" stroke="#4da3ff" stroke-width="2" points="${R.map((x,i)=>X(i)+','+Y(x.r)).join(' ')}"/>`;
 const sv=document.getElementById('c');sv.setAttribute('viewBox',`0 0 ${W} ${H}`);sv.innerHTML=g;
 tb.innerHTML=R.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${f(x.t)}</td><td>${f(x.s)}</td><td >${f(x.r,3)}</td></tr>`).join('');
});}
load();setInterval(load,5*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
